<!DOCTYPE html>
<html lang="th">
<!-- ... (ส่วนหัวและ Style คงเดิมครับ) ... -->
<!-- (นำโค้ด CSS เดิมของอาจารย์มาวางตรงนี้ได้เลยครับ เพื่อไม่ให้ยาวเกินไป) -->

<body>
    <!-- (ส่วน HTML คงเดิมครับ) -->

<script>
    // === [จุดแก้ไขที่ 1] รหัสผ่านสมาชิก VIP อยู่ล่างสุดตรงนี้ครับ! ===
    const memberPasswords = [
        "1234", 
        "VIP2026", 
        "Master555" // อาจารย์เพิ่มรหัสใหม่ต่อท้ายได้เลยครับ
    ];
    // ==========================================================

    function checkLogin() {
        const pass = document.getElementById('vipPassword').value.trim();
        
        // เช็กว่ารหัสที่กรอก มีอยู่ในรายชื่อด้านบนไหม
        if(memberPasswords.includes(pass)) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('calculatorView').style.display = 'block';
            alert("ยินดีต้อนรับอาจารย์เข้าสู่ระบบ VIP ครับ");
        } else {
            alert("รหัสผ่านไม่ถูกต้อง หรือยังไม่ได้เปิดสิทธิ์ใช้งานครับ");
        }
    }

    function logout() {
        document.getElementById('calculatorView').style.display = 'none';
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('vipPassword').value = '';
        document.getElementById('results').innerHTML = '';
    }

    function calculateLottery() {
        // (ฟังก์ชันคำนวณเดิมของอาจารย์)
        let top = document.getElementById('topNum').value.trim();
        let bottom = document.getElementById('bottomNum').value.trim();

        if (top.length !== 3 || bottom.length !== 2) {
            alert("กรุณากรอกเลข 3 ตัวบน และ 2 ตัวล่างให้ครบถ้วน!");
            return;
        }

        let r1 = parseInt(top[0]);
        let r2 = parseInt(top[1]);
        let r3 = parseInt(top[2]);
        let b1 = parseInt(bottom[0]);
        let b2 = parseInt(bottom[1]);

        let f1_d1 = (r2 + b1) % 10;
        let f1_d2 = (f1_d1 + 1) % 10;
        let f2_d1 = (r1 + r2 + r3) % 10;
        let f2_d2 = (f2_d1 + 1) % 10;
        let f3_d1 = (r1 + b1) % 10;
        let f3_d2 = (f3_d1 + 1) % 10;
        let f4_d1 = (r3 + b2) % 10;
        let f4_d2 = (f4_d1 + 1) % 10;
        let f5_d1 = (10 - b2) % 10;
        let f5_d2 = (f5_d1 + 1) % 10;

        let formulas = [
            { name: "สูตรที่ 1", d1: f1_d1, d2: f1_d2 },
            { name: "สูตรที่ 2", d1: f2_d1, d2: f2_d2 },
            { name: "สูตรที่ 3", d1: f3_d1, d2: f3_d2 },
            { name: "สูตรที่ 4", d1: f4_d1, d2: f4_d2 },
            { name: "สูตรที่ 5", d1: f5_d1, d2: f5_d2 }
        ];

        let html = "";
        formulas.forEach(f => {
            let de1 = f.d1;
            let de2 = f.d2;
            let pool1 = [];
            let pool2 = [];
            for(let i=0; i<=9; i++) {
                if(i !== de1) pool1.push(i);
                if(i !== de2) pool2.push(i);
            }
            let row1 = pool1.slice(0, 5).map(n => "" + de1 + n).join("  ");
            let row2 = pool2.slice(0, 5).map(n => "" + de2 + n).join("  ");

            html += `
                <div class="formula-card">
                    <div class="formula-title">${f.name}</div>
                    <div style="font-size: 1rem; margin-bottom: 5px;">เลขเด่น: <span class="highlight">${de1} - ${de2}</span></div>
                    <div class="row-group">
                        <span class="row-label">ชุดเจาะ ${de1}</span>
                        <span class="row-nums" style="color: #38bdf8;">${row1}</span>
                    </div>
                    <div class="row-group">
                        <span class="row-label">ชุดเจาะ ${de2}</span>
                        <span class="row-nums" style="color: #4ade80;">${row2}</span>
                    </div>
                </div>
            `;
        });
        document.getElementById('results').innerHTML = html;
    }
</script>
</body>
</html>
