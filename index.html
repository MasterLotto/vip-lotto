<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#02060c">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self';">
<title>MasterLotto VIP+ — AI Quant Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#02060c;--bg2:#050b13;--panel:#07101b;--panel2:#091522;--cyan:#00e5ff;--cyan2:#22d3ee;--green:#10b981;--green2:#34d399;--red:#ef4444;--red2:#f87171;--gold:#f59e0b;--gold2:#fbbf24;--purple:#a855f7;--white:#f8fafc;--text:#cbd5e1;--muted:#64748b;--dim:#334155;--border:rgba(148,163,184,.10);--cyan-border:rgba(0,229,255,.28);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{min-height:100vh;padding:14px 10px 28px;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;color:var(--white);font-family:'Prompt',sans-serif;background:linear-gradient(145deg,#01040a,#030812 45%,#02060c);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:42px 42px;}
.ai-orb{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(150px);pointer-events:none;z-index:0;opacity:.15;}
.ai-orb.one{top:-240px;left:-190px;background:#2563eb;}
.ai-orb.two{bottom:-220px;right:-190px;background:#00e5ff;}
.vip-container{width:100%;max-width:475px;position:relative;z-index:5;overflow:hidden;padding:18px 14px 22px;border:1px solid rgba(0,229,255,.32);border-radius:28px;background:linear-gradient(145deg,rgba(10,20,34,.985),rgba(2,7,14,.995));box-shadow:0 45px 120px rgba(0,0,0,.85),0 0 95px rgba(0,229,255,.08),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.terminal-topline{height:3px;width:100%;margin-bottom:15px;border-radius:20px;background:linear-gradient(90deg,transparent,#00e5ff 20%,#34d399 50%,#00e5ff 80%,transparent);box-shadow:0 0 18px rgba(0,229,255,.55);}
.header-box{text-align:center;margin-bottom:14px;}
.ai-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;margin-bottom:10px;border-radius:30px;color:#67e8f9;font-size:.62rem;font-weight:800;letter-spacing:1.4px;border:1px solid rgba(0,229,255,.32);background:linear-gradient(135deg,rgba(0,229,255,.13),rgba(59,130,246,.05));box-shadow:0 0 20px rgba(0,229,255,.10);}
.ai-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 9px #34d399;}
.header-box h2{font-size:1.78rem;line-height:1.1;font-weight:800;letter-spacing:-.7px;display:inline-block;background:linear-gradient(110deg,#fff 0%,#7dd3fc 20%,#00e5ff 35%,#fff 48%,#34d399 65%,#fff 80%,#00e5ff 100%);background-size:240% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.vip-plus-symbol{background:linear-gradient(135deg,#fff7cc,#fbbf24,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(251,191,36,.65));margin-left:2px;}
.header-box p{margin-top:5px;color:#64748b;font-size:.68rem;font-weight:400;}
.ai-status-bar{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 12px;margin-bottom:12px;border-radius:13px;color:#94a3b8;font-size:.65rem;background:rgba(2,8,15,.78);border:1px solid rgba(52,211,153,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 25px rgba(0,0,0,.25);transition:.3s;}
.ai-status-bar:hover{border-color:rgba(52,211,153,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 30px rgba(16,185,129,.15);}
.pulse-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 9px rgba(16,185,129,.9);}
.package-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
.package-card{position:relative;overflow:hidden;padding:13px 9px;text-align:center;border-radius:15px;background:linear-gradient(145deg,rgba(16,28,46,.95),rgba(5,11,20,.98));border:1px solid rgba(255,255,255,.08);transition:.3s;}
.package-card:hover{transform:translateY(-3px);border-color:rgba(0,229,255,.45);box-shadow:0 12px 30px rgba(0,229,255,.15);background:linear-gradient(145deg,rgba(22,38,62,.98),rgba(8,16,28,.99));}
.package-card::before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;}
.p-1::before{background:#a855f7}.p-2::before{background:#00e5ff}.p-3::before{background:#f59e0b}.p-4::before{background:#10b981}
.package-card h3{color:#cbd5e1;font-size:.68rem;font-weight:600;}
.package-card .price{margin-top:3px;color:#fff;font-size:1.15rem;font-weight:800;text-shadow:0 0 10px rgba(255,255,255,.2);}
.package-card .desc{margin-top:2px;color:#475569;font-size:.54rem;}
.btn-line{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;padding:12px;margin-bottom:12px;border-radius:14px;color:#fff;text-decoration:none;font-size:.76rem;font-weight:700;background:linear-gradient(135deg,#06c755,#008f39);box-shadow:0 7px 22px rgba(6,199,85,.25);transition:.3s;border:1px solid rgba(255,255,255,.15);}
.btn-line:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 10px 30px rgba(6,199,85,.4);}
input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);outline:none;background:#050c15;color:#fff;font-family:'Prompt',sans-serif;font-size:.86rem;text-align:center;transition:.3s;}
input::placeholder{color:#334155;}
input:focus{border-color:rgba(0,229,255,.8);box-shadow:0 0 0 3px rgba(0,229,255,.15),0 0 15px rgba(0,229,255,.2);}
.action-btn{width:100%;padding:11px;margin-top:10px;border:0;border-radius:12px;color:#fff;font-family:'Prompt',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#0284c7,#075985);box-shadow:0 6px 20px rgba(2,132,199,.25);transition:.3s;border:1px solid rgba(255,255,255,.12);}
.action-btn:hover{transform:translateY(-2px);filter:brightness(1.15);box-shadow:0 10px 25px rgba(2,132,199,.4);}
.input-group-calc{margin-bottom:11px;}
.input-label{display:block;margin-bottom:5px;color:#cbd5e1;font-size:.68rem;font-weight:600;}
.last-session-badge{display:none;justify-content:center;align-items:center;gap:7px;margin-bottom:12px;padding:7px 10px;border-radius:11px;background:rgba(4,10,20,.8);border:1px solid rgba(0,229,255,.25);color:#cbd5e1;font-size:.62rem;}
.action-row{display:flex;gap:8px;margin-bottom:12px;}
.btn-calculate{flex:1;display:flex;justify-content:center;align-items:center;gap:7px;padding:11px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#10b981,#047857);font-family:'Prompt',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(16,185,129,.25);transition:.3s;border:1px solid rgba(255,255,255,.15);}
.btn-calculate:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 10px 25px rgba(16,185,129,.4);}
.btn-calculate:disabled{cursor:not-allowed;opacity:.5;transform:none!important;}
.btn-clear{width:72px;border-radius:12px;border:1px solid rgba(255,255,255,.12);color:#94a3b8;background:#101925;font-family:'Prompt',sans-serif;font-size:.68rem;font-weight:600;cursor:pointer;transition:.3s;}
.btn-clear:hover{background:#182435;color:#fff;border-color:rgba(255,255,255,.25);}
#aiScannerBox{display:none;position:relative;overflow:hidden;padding:25px 12px;margin-bottom:12px;text-align:center;border-radius:20px;border:1px solid rgba(0,229,255,.38);background:radial-gradient(circle at center,rgba(0,229,255,.17),transparent 65%),#030a13;box-shadow:0 15px 45px rgba(0,0,0,.5);}
.scanner-grid{position:absolute;inset:0;opacity:.16;background:linear-gradient(rgba(0,229,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.35) 1px,transparent 1px);background-size:22px 22px;}
.neural-radar{position:relative;width:66px;height:66px;margin:0 auto 12px;border-radius:50%;border:2px solid rgba(56,189,248,.15);border-top-color:#00e5ff;border-right-color:#34d399;animation:spin 1.5s linear infinite;box-shadow:0 0 20px rgba(0,229,255,.25),inset 0 0 18px rgba(0,229,255,.08);}
.neural-radar::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(0,229,255,.45);}
@keyframes spin{to{transform:rotate(360deg)}}
#aiScannerText{position:relative;color:#67e8f9;font-size:.72rem;font-weight:600;}
.consensus-box{position:relative;overflow:hidden;padding:17px 11px;margin-bottom:12px;border-radius:23px;text-align:center;border:1px solid rgba(0,229,255,.32);background:radial-gradient(circle at 100% 0%,rgba(0,229,255,.15),transparent 38%),radial-gradient(circle at 0% 100%,rgba(16,185,129,.10),transparent 42%),linear-gradient(145deg,#08121f,#020810);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.45);}
.consensus-title{font-size:.58rem;font-weight:800;letter-spacing:2px;color:#67e8f9;}
.consensus-subtitle{margin:3px 0 12px;font-size:1.08rem;font-weight:800;}
.consensus-main-digits{display:flex;justify-content:center;align-items:center;gap:11px;margin:4px 0 14px;}
.consensus-digit{width:65px;height:65px;display:flex;justify-content:center;align-items:center;border-radius:50%;color:#fff;font-family:monospace;font-size:1.7rem;font-weight:900;background:radial-gradient(circle at 30% 25%,rgba(14,116,144,.75),rgba(3,40,65,.85));border:2px solid rgba(0,229,255,.85);box-shadow:inset 0 3px 6px rgba(255,255,255,.25),0 0 25px rgba(0,229,255,.25);position:relative;}
.consensus-digit:first-child{border-color:#34d399;background:radial-gradient(circle at 30% 25%,rgba(5,150,105,.75),rgba(3,55,44,.85));box-shadow:inset 0 3px 6px rgba(255,255,255,.25),0 0 25px rgba(16,185,129,.25);}
.consensus-divider{color:#475569;font-weight:800;}
.consensus-pair-panel{padding:11px;margin-top:9px;border-radius:17px;background:rgba(2,8,16,.75);border:1px solid rgba(0,229,255,.23);text-align:left;transition:.3s;}
.consensus-pair-panel:hover{border-color:rgba(0,229,255,.6);box-shadow:0 10px 30px rgba(0,229,255,.12);background:rgba(4,12,24,.85);}
.consensus-pair-header{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-bottom:8px;}
.consensus-pair-title{color:#e2e8f0;font-size:.65rem;font-weight:700;display:flex;align-items:center;gap:6px;}
.status-dot-emerald,.status-dot-cyan,.status-dot-amber{display:inline-block;width:6px;height:6px;border-radius:50%;}
.status-dot-emerald{background:#34d399;box-shadow:0 0 9px #34d399;}
.status-dot-cyan{background:#00e5ff;box-shadow:0 0 9px #00e5ff;}
.status-dot-amber{background:#fbbf24;box-shadow:0 0 9px #fbbf24;}
.highlight-digit{color:#fcd34d;font-weight:800;}
.consensus-pair-count{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:8px;color:#e2e8f0;font-size:.42rem;background:rgba(35,15,20,.75);border:1px solid rgba(248,113,113,.55);transform:scale(0.8);transform-origin:right center;}
.consensus-pair-count strong{color:#fff;font-family:monospace;font-size:.48rem;}

.consensus-pairs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%;}
.consensus-pair-wrapper{display:flex;flex-direction:column;align-items:center;min-width:0;}
.consensus-pair{width:100%;padding:6px 1px;text-align:center;border-radius:8px;color:#34d399;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.27);font-family:monospace;font-size:.72rem;font-weight:800;cursor:pointer;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.consensus-pair.second{color:#00e5ff;background:rgba(0,229,255,.08);border-color:rgba(0,229,255,.25);}
.consensus-pair.third-set{color:#c084fc;background:rgba(192,132,252,.08);border-color:rgba(192,132,252,.25);font-size:.66rem;}
.consensus-pair:hover{transform:translateY(-2px);border-color:#facc15;filter:brightness(1.15);}
.consensus-pair-pct{margin-top:3px;color:#64748b;font-family:monospace;font-size:.44rem;font-weight:700;}

.market-radar{position:relative;overflow:hidden;margin-top:10px;padding:12px 10px;border-radius:18px;background:radial-gradient(circle at 100% 0%,rgba(0,229,255,.10),transparent 40%),linear-gradient(145deg,#07121e,#030911);border:1px solid rgba(0,229,255,.22);}
.market-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;}
.market-kicker{display:flex;align-items:center;gap:5px;color:#00e5ff;font-size:.45rem;font-weight:800;letter-spacing:1.2px;}
.market-kicker-dot{width:5px;height:5px;border-radius:50%;background:#00e5ff;}
.market-title{margin-top:2px;color:#f8fafc;font-size:.84rem;font-weight:800;}
.market-desc{margin-top:1px;color:#475569;font-size:.48rem;}
.market-live{display:flex;align-items:center;gap:5px;padding:4px 7px;border-radius:7px;color:#34d399;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.3);font-size:.42rem;font-weight:800;}
.market-live-dot{width:5px;height:5px;border-radius:50%;background:#34d399;}
.market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;}
.market-stat{padding:7px 4px;text-align:center;border-radius:9px;background:#030a12;border:1px solid rgba(255,255,255,.05);transition:.3s;}
.market-stat:hover{border-color:rgba(0,229,255,.4);transform:translateY(-1px);}
.market-stat:first-child{border-color:rgba(52,211,153,.28);}
.market-stat:nth-child(2){border-color:rgba(0,229,255,.25);}
.market-rank{color:#334155;font-size:.38rem;font-weight:700;}
.market-digit{margin-top:1px;color:#f8fafc;font-family:monospace;font-size:1.05rem;font-weight:900;}
.market-stat:first-child .market-digit{color:#34d399;}
.market-stat:nth-child(2) .market-digit{color:#00e5ff;}
.market-percent{margin-top:1px;color:#94a3b8;font-family:monospace;font-size:.43rem;font-weight:800;}
.market-status{margin-top:1px;color:#475569;font-size:.36rem;font-weight:700;}
.market-chart-shell{padding:8px;border-radius:12px;background:rgba(255,255,255,.018);border:1px solid rgba(255,255,255,.05);}
.chart-topline{display:flex;justify-content:space-between;margin-bottom:5px;}
.chart-label{color:#cbd5e1;font-size:.43rem;font-weight:800;}
.chart-value-label{color:#475569;font-family:monospace;font-size:.4rem;}
.market-chart{position:relative;width:100%;height:120px;overflow:hidden;border-radius:7px;background:repeating-linear-gradient(to bottom,rgba(148,163,184,.045) 0,rgba(148,163,184,.045) 1px,transparent 1px,transparent 25%);}
.chart-axis{position:absolute;inset:0;pointer-events:none;}
.chart-axis span{position:absolute;right:2px;color:#334155;font-family:monospace;font-size:.36rem;}
.chart-axis .a100{top:0}.chart-axis .a75{top:25%}.chart-axis .a50{top:50%}.chart-axis .a25{top:75%}.chart-axis .a0{bottom:0}
.chart-svg{position:absolute;inset:0;width:100%;height:100%;}
.chart-line{fill:none;stroke:#00e5ff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.chart-area{fill:url(#marketAreaGradient);opacity:.55;}
.chart-point{fill:#06111c;stroke:#34d399;stroke-width:2;}
.chart-point-label{fill:#cbd5e1;font-family:monospace;font-size:9px;font-weight:800;text-anchor:middle;}
.market-bars{margin-top:7px;display:flex;flex-direction:column;gap:5px;}
.market-bar-row{display:grid;grid-template-columns:22px 1fr 34px;align-items:center;gap:6px;}
.market-bar-digit{color:#cbd5e1;font-family:monospace;font-size:.58rem;font-weight:800;}
.market-bar-track{height:5px;overflow:hidden;border-radius:8px;background:#172130;}
.market-bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#0e7490,#00e5ff,#34d399);}
.market-bar-percent{text-align:right;color:#cbd5e1;font-family:monospace;font-size:.42rem;font-weight:800;}
.market-footnote{margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.05);color:#475569;text-align:center;font-size:.39rem;}
.market-footnote strong{color:#00e5ff;}
.signal-panel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:9px;}
.signal-card{padding:8px 5px;text-align:center;border-radius:10px;background:#030a12;border:1px solid rgba(255,255,255,.05);transition:.3s;}
.signal-card:hover{border-color:rgba(0,229,255,.25);}
.signal-label{color:#475569;font-size:.4rem;font-weight:700;}
.signal-value{margin-top:2px;font-family:monospace;font-size:.58rem;font-weight:900;}
.signal-value.bull{color:#34d399}.signal-value.neutral{color:#fbbf24}.signal-value.watch{color:#f87171}
.formula-toggle-container{margin-top:12px;margin-bottom:10px;}
.btn-toggle-formulas{width:100%;display:flex;justify-content:center;align-items:center;gap:7px;padding:11px;border-radius:12px;border:1px solid rgba(0,229,255,.3);color:#67e8f9;background:rgba(0,229,255,.08);font-family:'Prompt',sans-serif;font-size:.72rem;font-weight:700;cursor:pointer;transition:.3s;box-shadow:0 4px 15px rgba(0,229,255,.08);}
.btn-toggle-formulas:hover{background:rgba(0,229,255,.15);border-color:rgba(0,229,255,.6);box-shadow:0 6px 20px rgba(0,229,255,.2);transform:translateY(-1px);}
#formulasWrapper{display:none;margin-top:10px;}
.formula-card{position:relative;overflow:hidden;padding:9px 11px;margin-bottom:8px;border-radius:12px;background:radial-gradient(circle at 0% 0%,rgba(0,229,255,.07),transparent 50%),#050c15;border:1px solid rgba(0,229,255,.18);transition:.3s;}
.formula-card:hover{border-color:rgba(0,229,255,.45);box-shadow:0 6px 20px rgba(0,229,255,.08);}
.formula-card::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(180deg,#00e5ff,#34d399);}
.formula-header-flex{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.formula-title{color:#f8fafc;font-size:.62rem;font-weight:700;}
.formula-meta-stack{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.hot-badge,.ai-match-badge,.accuracy-tag{display:inline-flex;justify-content:center;align-items:center;padding:1px 5px;border-radius:4px;font-size:.38rem;font-weight:800;transform:scale(0.85);transform-origin:right center;}
.hot-badge{color:#f87171;background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.28);}
.ai-match-badge{color:#34d399;background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25);}
.accuracy-tag{color:#00e5ff;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);}
.formula-sub{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.04);color:#94a3b8;font-size:.54rem;}

.formula-pairs-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px;width:100%;}
.formula-pair-cell{display:flex;flex-direction:column;align-items:center;padding:5px 2px;background:rgba(2,8,16,.85);border:1px solid rgba(0,229,255,.2);border-radius:7px;cursor:pointer;transition:.2s;}
.formula-pair-cell:hover{border-color:#facc15;transform:translateY(-1px);filter:brightness(1.15);}
.formula-pair-num{font-family:monospace;font-size:.65rem;font-weight:800;color:#34d399;}
.formula-pair-cell.second .formula-pair-num{color:#00e5ff;}
.formula-pair-pct{font-family:monospace;font-size:.38rem;color:#64748b;margin-top:1px;}

.radar-dot-wrapper {
    display: inline-flex;
    align-items: center;
    position: relative;
    width: 10px;
    height: 10px;
    margin-right: 6px;
    vertical-align: middle;
}
.radar-core-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    z-index: 2;
}

#toast{visibility:hidden;position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:9999;min-width:210px;padding:10px 20px;border-radius:50px;color:#fff;text-align:center;font-size:.7rem;font-weight:700;background:linear-gradient(135deg,#10b981,#047857);box-shadow:0 15px 40px rgba(0,0,0,.7);}
#toast.show{visibility:visible;animation:toastInOut 1.8s ease forwards;}
@keyframes toastInOut{0%{opacity:0;bottom:10px}20%,80%{opacity:1;bottom:25px}100%{opacity:0;bottom:15px}}
</style>
</head>
<body>
<div class="ai-orb one"></div>
<div class="ai-orb two"></div>
<div class="vip-container">
<div class="terminal-topline"></div>
<div id="calculatorView" style="display:block;">
    <div class="header-box">
        <div class="ai-badge">AI QUANT ANALYSIS ENGINE</div>
        <h2>MasterLotto VIP<span class="vip-plus-symbol">+</span></h2>
        <p>ระบบประมวลผล AI อัจฉริยะ</p>
    </div>
    
    <div class="ai-status-bar">
        <span style="display:inline-flex; align-items:center;">
            <span class="radar-dot-wrapper">
                <span class="radar-core-dot" style="background:#00e5ff; box-shadow:0 0 10px #00e5ff;"></span>
            </span>
            ยอดประมวลผลรวมในระบบ : <strong id="totalCalcCounter" style="color:#00e5ff; margin-left:4px; margin-right:4px;">30,482</strong> ครั้ง
        </span>
    </div>

    <div id="lastSessionBadge" class="last-session-badge">
        <span style="display:inline-flex; align-items:center;">
            <span class="radar-dot-wrapper">
                <span class="radar-core-dot" style="background:#fde047; box-shadow:0 0 10px #fde047;"></span>
            </span>
            อ้างอิงล่าสุด : <strong style="color:#ffffff; font-weight:500;">3 ตัวบน&nbsp;</strong><strong id="lbl3" style="color:#fde047; margin-left:2px; font-weight:700;"></strong> &nbsp;|&nbsp; <span style="color:#ffffff; font-weight:500;">2 ตัวล่าง <strong id="lbl2" style="color:#fde047; margin-left:2px; font-weight:700;"></strong></span>
        </span>
    </div>

    <div class="input-group-calc">
        <label class="input-label">เลข 3 ตัวบน (งวดล่าสุด)</label>
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="num3top" placeholder="เช่น 701" maxlength="3" autocomplete="off" spellcheck="false">
    </div>
    <div class="input-group-calc">
        <label class="input-label">เลข 2 ตัวล่าง (งวดล่าสุด)</label>
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="num2bottom" placeholder="เช่น 26" maxlength="2" autocomplete="off" spellcheck="false">
    </div>
    <div class="action-row">
        <button class="btn-calculate" id="calculateButton">⚡ เริ่มประมวลผล AI</button>
        <button class="btn-clear" id="clearButton">ล้างค่า</button>
    </div>
    <div id="aiScannerBox">
        <div class="scanner-grid"></div>
        <div class="neural-radar"></div>
        <div id="aiScannerText">INITIALIZING QUANT ANALYSIS...</div>
    </div>
    <div id="resultContainer"></div>
</div>
</div>
<div id="toast">คัดลอกตัวเลขเรียบร้อยแล้ว!</div>
<script>
const _app={
_audio(t="click"){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();const o=c.createOscillator();const g=c.createGain();o.type=t==="error"?"sawtooth":"sine";o.frequency.setValueAtTime(t==="error"?180:580,c.currentTime);g.gain.setValueAtTime(t==="error"?.07:.045,c.currentTime);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(t==="error"?.12:.06));}catch(e){}},
_esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");},
clearCalc(){this._audio("click");document.getElementById("resultContainer").innerHTML="";document.getElementById("num3top").value="";document.getElementById("num2bottom").value="";document.getElementById("num3top").focus();},
checkSessionBadge(){const n3=localStorage.getItem("ml_l_n3_v2");const n2=localStorage.getItem("ml_l_n2_v2");const badge=document.getElementById("lastSessionBadge");if(n3&&n2){document.getElementById("lbl3").innerText=n3;document.getElementById("lbl2").innerText=n2;badge.style.display="flex";}else{badge.style.display="none";}},
calculate(){this._audio("click");const n3=document.getElementById("num3top").value.trim();const n2=document.getElementById("num2bottom").value.trim();if(!/^\d{3}$/.test(n3)||!/^\d{2}$/.test(n2)){this._audio("error");alert("กรุณากรอกเลข 3 ตัวให้ครบ 3 หลัก และเลข 2 ตัวล่างให้ครบ 2 หลัก");return;}localStorage.setItem("ml_l_n3_v2",n3);localStorage.setItem("ml_l_n2_v2",n2);this.checkSessionBadge();const scan=document.getElementById("aiScannerBox");const btn=document.getElementById("calculateButton");btn.disabled=true;scan.style.display="block";const messages=["SCANNING HISTORICAL STRUCTURE...","CALCULATING DIGIT MOMENTUM...","RUNNING NEURAL CONSENSUS...","BUILDING QUANT SIGNAL...","FINALIZING ANALYSIS..."];let mi=0;const scannerText=document.getElementById("aiScannerText");scannerText.innerText=messages[0];const msgTimer=setInterval(()=>{mi++;if(mi<messages.length){scannerText.innerText=messages[mi];}},120);setTimeout(()=>{clearInterval(msgTimer);scan.style.display="none";btn.disabled=false;this.runAnalysis(n3,n2);document.getElementById("resultContainer").scrollIntoView({behavior:"smooth",block:"start"});},400);},
runAnalysis(n3,n2){
const d3=n3.split("").map(Number);const d2=n2.split("").map(Number);const [A,B,C]=d3;const [R1,R2]=d2;const mod=v=>((v%10)+10)%10;const getPair=v=>{const f=mod(v);return[f,mod(f+1)];};
const fList=[{name:"$#%@&_█░▒▓",set:getPair(A+R1)},{name:"█▓▒░_#&%@$",set:getPair(B+C)},{name:"$█&▒_#%░▓",set:getPair(A+B+C)},{name:"▓▒░█_@#%$&",set:getPair(R1+R2)},{name:"#&@_█▓▒░$",set:getPair(A*2+B)}];const votes={};for(let d=0;d<=9;d++){votes[d]=0;}fList.forEach(item=>{item.set.forEach(dig=>{votes[dig]++;});});fList.forEach(item=>{item.score=item.set.reduce((acc,dg)=>acc+((votes[dg]||1)*25),100);item.consensusCount=item.set.reduce((max,dg)=>Math.max(max,votes[dg]||0),0);});fList.sort((a,b)=>b.consensusCount-a.consensusCount||b.score-a.score);fList.forEach((item,idx)=>{item.isHot=idx<3;});fList.forEach((item,idx)=>{const maxVote=item.consensusCount;let baseScore=87.5;if(maxVote>=3){baseScore=99.1-(idx*.1);}else if(maxVote===2){baseScore=95-(idx*.5);}else{baseScore=91-(idx*.8);}item.aiScore=Number(Math.max(87.5,Math.min(99.9,baseScore)).toFixed(1));});const target=mod(Math.abs(7-A));const evaluated=fList.map(item=>{let match=false;for(let off=-2;off<=2;off++){if(item.set.includes(mod(target+off))){match=true;break;}}const span=match?3:2;const pool=[];for(let off=-span;off<=span;off++){pool.push(mod(target+off));}const cleanPool=pool.filter(dg=>!item.set.includes(dg)).filter((dg,i,arr)=>arr.indexOf(dg)===i).sort((a,b)=>a-b);const pMap={};item.set.forEach(dg=>{pMap[dg]=cleanPool.filter(sub=>sub!==dg).map(sub=>`${dg}${sub}`);});return{name:item.name,isHot:item.isHot,score:item.score,aiScore:item.aiScore,set:item.set,pairsMap:pMap};});const winner=evaluated[0];const [d1,d2_dig]=winner.set;const arr1=winner.pairsMap[d1]||[];const arr2=winner.pairsMap[d2_dig]||[];const formula1=evaluated[0];const formula2=evaluated[1];const cScore1=formula1?formula1.aiScore:99.9;let cScore2=formula2?formula2.aiScore:96.4;if(cScore1===cScore2||Math.abs(cScore1-cScore2)<.5){cScore2=Number((cScore1-.4).toFixed(1));}const cScore3=Number((50.1+Math.random()*.8).toFixed(1));const marketDigits=Object.keys(votes).map(Number).map(digit=>{const v=votes[digit]||0;let maxAi=87.5;evaluated.forEach(f=>{if(f.set.includes(digit)&&f.aiScore>maxAi){maxAi=f.aiScore;}});return{digit,votes:v,percentage:v>0?maxAi:0};}).filter(i=>i.votes>0).sort((a,b)=>b.votes-a.votes||b.percentage-a.percentage||a.digit-b.digit).slice(0,4);const marketTop=marketDigits.map((item,index)=>index===0||index===1?{...item,percentage:index===0?cScore1:cScore2}:item);const marketMax=Math.max(...marketTop.map(i=>i.percentage),99.9);const marketRanked=marketTop.map((item,index)=>({...item,rank:index+1,status:item.percentage>=93?"HIGH":item.percentage>=88?"MEDIUM":"WATCH"}));

const matrixD1 = marketRanked[0] ? marketRanked[0].digit : d1;
const matrixD2 = marketRanked[1] ? marketRanked[1].digit : d2_dig;
const matrixScore1 = marketRanked[0] ? marketRanked[0].percentage : cScore1;
const matrixScore2 = marketRanked[1] ? marketRanked[1].percentage : cScore2;
const matrixArr1 = evaluated.find(f => f.set.includes(matrixD1)) ? evaluated.find(f => f.set.includes(matrixD1)).pairsMap[matrixD1] || arr1 : arr1;
const matrixArr2 = evaluated.find(f => f.set.includes(matrixD2)) ? evaluated.find(f => f.set.includes(matrixD2)).pairsMap[matrixD2] || arr2 : arr2;
const finalMatrix3d = matrixArr1.map(p=>`${p.slice(-1)}${matrixD1}${matrixD2}`);

const html1=matrixArr1.length?matrixArr1.map((p,idx)=>{const pct=Number((98.5-idx*.4).toFixed(1));return`<div class="consensus-pair-wrapper"><div class="consensus-pair" data-copy="${this._esc(p)}">${this._esc(p)}</div><div class="consensus-pair-pct">${pct}%</div></div>`;}).join(""):`<span style="color:#64748b;font-size:.7rem">ไม่มีชุดข้อมูล</span>`;
const html2=matrixArr2.length?matrixArr2.map((p,idx)=>{const pct=Number((97.8-idx*.4).toFixed(1));return`<div class="consensus-pair-wrapper"><div class="consensus-pair second" data-copy="${this._esc(p)}">${this._esc(p)}</div><div class="consensus-pair-pct">${pct}%</div></div>`;}).join(""):`<span style="color:#64748b;font-size:.7rem">ไม่มีชุดข้อมูล</span>`;
const html3=finalMatrix3d.length?finalMatrix3d.map((p,idx)=>{const pct=Number((50.4-idx*.1).toFixed(1));return`<div class="consensus-pair-wrapper"><div class="consensus-pair third-set" data-copy="${this._esc(p)}">${this._esc(p)}</div><div class="consensus-pair-pct">${pct}%</div></div>`;}).join(""):`<span style="color:#64748b;font-size:.7rem">ไม่มีชุดข้อมูล</span>`;

const marketCards=marketRanked.map(item=>`<div class="market-stat"><div class="market-rank">#${String(item.rank).padStart(2,"0")}</div><div class="market-digit">${item.digit}</div><div class="market-percent">${item.percentage}%</div><div class="market-status">${item.status}</div></div>`).join("");const w=400,h=120,px=18,pTop=13,pBot=15,uW=w-px*2,uH=h-pTop-pBot;const chartPoints=marketRanked.map((item,index)=>{const cx=marketRanked.length===1?w/2:px+(index/(marketRanked.length-1))*uW;const cy=pTop+(1-((item.percentage-80)/Math.max(marketMax-80,1)))*uH;return{...item,x:cx,y:Math.max(pTop,Math.min(h-pBot,cy))};});const linePath=chartPoints.length?chartPoints.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" "):"";let areaPath="";if(chartPoints.length){const first=chartPoints[0],last=chartPoints[chartPoints.length-1];areaPath=`M ${first.x} ${h-pBot} L ${chartPoints.map(p=>`${p.x} ${p.y}`).join(" L ")} L ${last.x} ${h-pBot} Z`;}const chartPointHTML=chartPoints.map(p=>`<circle class="chart-point" cx="${p.x}" cy="${p.y}" r="4"></circle><text class="chart-point-label" x="${p.x}" y="${Math.max(10,p.y-9)}">${p.digit}</text>`).join("");const marketBars=marketRanked.map(item=>{const width=Math.max(15,((item.percentage-80)/Math.max(marketMax-80,1))*100);return`<div class="market-bar-row"><div class="market-bar-digit">${item.digit}</div><div class="market-bar-track"><div class="market-bar-fill" style="width:${width}%"></div></div><div class="market-bar-percent">${item.percentage}%</div></div>`;}).join("");const signalText=matrixScore1>=95?"BULLISH":matrixScore1>=90?"POSITIVE":"WATCH";const signalClass=matrixScore1>=95?"bull":matrixScore1>=90?"neutral":"watch";

let fHTML=`<div class="consensus-box"><div class="consensus-title">⚡ AI SMART SYNTHESIS</div><div class="consensus-subtitle">Neural Consensus Matrix</div><div class="consensus-main-digits"><div class="consensus-digit">${matrixD1}</div><div class="consensus-divider">—</div><div class="consensus-digit">${matrixD2}</div></div><div class="consensus-pair-panel"><div class="consensus-pair-header"><div class="consensus-pair-title"><span class="status-dot-emerald"></span>ชุดเด่น <span class="highlight-digit">${matrixD1}</span></div><div class="consensus-pair-count" style="font-size:.55rem; padding:4px 9px;">CONFIDENCE <strong style="font-size:.6rem;">${matrixScore1}%</strong></div></div><div class="consensus-pairs">${html1}</div></div><div class="consensus-pair-panel"><div class="consensus-pair-header"><div class="consensus-pair-title"><span class="status-dot-cyan"></span>ชุดรอง <span class="highlight-digit">${matrixD2}</span></div><div class="consensus-pair-count" style="font-size:.55rem; padding:4px 9px;">CONFIDENCE <strong style="font-size:.6rem;">${matrixScore2}%</strong></div></div><div class="consensus-pairs">${html2}</div></div><div class="consensus-pair-panel"><div class="consensus-pair-header"><div class="consensus-pair-title"><span class="status-dot-amber"></span>ชุด 3 ตัว <span style="font-size:.4rem;padding:2px 5px;background:#b45309;color:#fff;border-radius:4px;">VIP+</span></div><div class="consensus-pair-count" style="font-size:.55rem; padding:4px 9px;">ACCURACY <strong style="font-size:.6rem;">${cScore3}%</strong></div></div><div class="consensus-pairs">${html3}</div></div></div><div class="market-radar"><div class="market-header"><div><div class="market-kicker"><span class="market-kicker-dot"></span>AI LOTTERY SIGNAL</div><div class="market-title">AI Lottery Master</div><div class="market-desc">ระบบจำลองรูปแบบตัวเลข 1 Trillion</div></div><div class="market-live"><span class="market-live-dot"></span>LIVE SIM</div></div><div class="market-grid">${marketCards}</div><div class="market-bars">${marketBars}</div><div class="market-chart-shell" style="margin-top:8px;"><div class="chart-topline"><div class="chart-label">DIGIT MOMENTUM</div><div class="chart-value-label">FORMULA CONSENSUS</div></div><div class="market-chart"><div class="chart-axis"><span class="a100">${marketMax}%</span><span class="a75">${Math.round(80+(marketMax-80)*.75)}%</span><span class="a50">${Math.round(80+(marketMax-80)*.5)}%</span><span class="a25">${Math.round(80+(marketMax-80)*.25)}%</span><span class="a0">80%</span></div><svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="marketAreaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00E5FF" stop-opacity=".30"/><stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/></linearGradient></defs><path class="chart-area" d="${areaPath}"></path><path class="chart-line" d="${linePath}"></path>${chartPointHTML}</svg></div></div><div class="market-footnote"><strong>SIGNAL SOURCE:</strong> INTERNAL STATISTICAL ENGINE • SIMULATION DISPLAY</div></div><div class="signal-panel"><div class="signal-card"><div class="signal-label">MARKET BIAS</div><div class="signal-value ${signalClass}">${signalText}</div></div><div class="signal-card"><div class="signal-label">AI CONSENSUS</div><div class="signal-value bull">${matrixScore1}%</div></div><div class="signal-card"><div class="signal-label">ENGINE</div><div class="signal-value cyan">ONLINE</div></div></div><div class="formula-toggle-container"><button class="btn-toggle-formulas" id="toggleFormulasBtn" onclick="_app.toggleFormulas()">📊 แสดง 5 สูตรวิเคราะห์ AI เพิ่มเติม</button></div><div id="formulasWrapper">`;

evaluated.forEach(item=>{
    let card=`<div class="formula-card">
        <div class="formula-header-flex">
            <div class="formula-title">${this._esc(item.name)}</div>
            <div class="formula-meta-stack">${item.isHot?'<div class="hot-badge">████████</div>':'<div class="ai-match-badge">████████</div>'}</div>
        </div>
        <div class="formula-sub">
            <span>เลขเด่น: <strong class="highlight-digit">#</strong>, <strong class="highlight-digit">#</strong></span>
            <div class="formula-meta-stack"><span class="accuracy-tag">████ ████</span></div>
        </div>`;
    
    let allPairs = [];
    item.set.forEach((dg, idx)=>{
        const plist = item.pairsMap[dg] || [];
        plist.forEach(p => {
            allPairs.push({pair: "█▒░", isSecond: idx === 1});
        });
    });

    if(allPairs.length > 0){
        card += `<div class="formula-pairs-grid">`;
        allPairs.forEach((obj, pIdx)=>{
            card += `<div class="formula-pair-cell ${obj.isSecond?'second':''}" data-copy="███">
                <span class="formula-pair-num">███</span>
                <span class="formula-pair-pct">██%</span>
            </div>`;
        });
        card += `</div>`;
    } else {
        card += `<div style="color:#64748b;font-size:.6rem;text-align:center;padding:6px;">ไม่มีชุดข้อมูล</div>`;
    }

    card += `</div>`;
    fHTML+=card;
});
fHTML+=`</div>`;document.getElementById("resultContainer").innerHTML=fHTML;document.querySelectorAll("[data-copy]").forEach(node=>{node.addEventListener("click",()=>{this.copyText(node.dataset.copy);});});},
toggleFormulas(){this._audio("click");const wrap=document.getElementById("formulasWrapper");const btn=document.getElementById("toggleFormulasBtn");if(wrap.style.display==="block"){wrap.style.display="none";btn.innerText="📊 แสดง 5 สูตรวิเคราะห์ AI เพิ่มเติม";}else{wrap.style.display="block";btn.innerText="📊 ซ่อน 5 สูตรวิเคราะห์ AI เพิ่มเติม";}},copyText(text){this._audio("click");if(!text)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>{this.showToast();}).catch(()=>{this.fallbackCopyText(text);});}else{this.fallbackCopyText(text);}},fallbackCopyText(text){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');this.showToast();}catch(e){}document.body.removeChild(ta);},showToast(){const toast=document.getElementById("toast");toast.className="show";setTimeout(()=>{toast.className="";},1800);},
startLiveStatsSimulation(){
    let currentCalc = parseInt(localStorage.getItem("ml_dynamic_calc_val") || "30482", 10);
    const calcEl = document.getElementById("totalCalcCounter");
    if(calcEl) calcEl.innerText = currentCalc.toLocaleString();
    const scheduleNextCalc = () => {
        const randomDelay = Math.floor(Math.random() * 5000) + 6000; 
        setTimeout(()=>{
            currentCalc += 1;
            localStorage.setItem("ml_dynamic_calc_val", currentCalc);
            if(calcEl) calcEl.innerText = currentCalc.toLocaleString();
            scheduleNextCalc();
        }, randomDelay);
    };
    scheduleNextCalc();
}};
document.addEventListener("DOMContentLoaded",()=>{
    const n3=document.getElementById("num3top");
    const n2=document.getElementById("num2bottom");
    if(n3&&n2){
        n3.addEventListener("input",e=>{if(n3.value.length>=3){n2.focus();}});
        n3.addEventListener("keypress",e=>{if(e.key==="Enter"){n2.focus();}});
        n2.addEventListener("keypress",e=>{if(e.key==="Enter"){_app.calculate();}});
        document.getElementById("calculateButton").addEventListener("click",()=>{_app.calculate();});
        document.getElementById("clearButton").addEventListener("click",()=>{_app.clearCalc();});
    }
    _app.startLiveStatsSimulation();
    _app.checkSessionBadge();
});
</script>
</body>
</html>
