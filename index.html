<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterLotto VIP</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a2a6c; }
        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .price-card { background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 8px; text-align: center; }
        .price-card h4 { margin: 5px 0; font-size: 14px; }
        .price-card .price { color: #c0392b; font-weight: bold; font-size: 16px; }
        .btn-line { display: block; width: 100%; background: #06c755; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
        .login-box { background: #e8f4fd; padding: 15px; border-radius: 8px; text-align: center; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
        button { width: 90%; padding: 10px; background: #2980b9; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #app-screen { display: none; }
        .formula-card { background: #f9f9f9; padding: 10px; margin-top: 10px; border-left: 4px solid #2980b9; }
    </style>
</head>
<body>

<div class="container" id="main-ui">
    <h2>MasterLotto VIP</h2>
    
    <div class="price-grid">
        <div class="price-card"><h4>7 วัน</h4><div class="price">99 ฿</div></div>
        <div class="price-card"><h4>15 วัน</h4><div class="price">199 ฿</div></div>
        <div class="price-card"><h4>30 วัน</h4><div class="price">299 ฿</div></div>
        <div class="price-card"><h4>1 ปี</h4><div class="price">1,890 ฿</div></div>
    </div>

    <div style="background:#f8f9fa; padding:10px; border-radius:8px; margin-bottom:15px;">
        <p>ธนาคาร: กสิกรไทย</p>
        <p>เลขบัญชี: <b>0661291613</b></p>
        <p>ชื่อบัญชี: ณัฐพงษ์ ขำสำอางค์</p>
    </div>

    <a href="https://line.me/ti/p/cWXNwvCmqc" class="btn-line">💬 แจ้งสลิป / ขอรับรหัส</a>

    <div class="login-box">
        <input type="password" id="passcode" placeholder="กรอกรหัสผ่าน VIP">
        <button onclick="checkPassword()">เข้าสู่ระบบ</button>
        <div id="errorMsg" style="color:red; margin-top:10px; display:none;">รหัสผ่านไม่ถูกต้อง</div>
    </div>
</div>

<div class="container" id="app-screen">
    <button onclick="logout()">ออกจากระบบ</button>
    <div style="margin-top:15px;">
        <input type="text" id="topNum" placeholder="เลข 3 ตัวบน" maxlength="3">
        <input type="text" id="bottomNum" placeholder="เลข 2 ตัวล่าง" maxlength="2">
        <button onclick="calculateLottery()" style="background:#27ae60;">คำนวณ</button>
    </div>
    <div id="results"></div>
</div>

<script>
    // รหัสผ่านที่อนุญาต
    const ALLOWED_PASSCODES = ["AJAN-MASTER-999", "VIP88-A89X"];

    function checkPassword() {
        let inputPass = document.getElementById('passcode').value.trim();
        if (ALLOWED_PASSCODES.includes(inputPass)) {
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    function logout() {
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';
    }

    function calculateLottery() {
        // [ระบบคำนวณสูตรเหมือนเดิม]
        let top = document.getElementById('topNum').value;
        let bottom = document.getElementById('bottomNum').value;
        if(top.length==3 && bottom.length==2) {
            document.getElementById('results').innerHTML = "<div class='formula-card'>ผลลัพธ์ปรากฏที่นี่...</div>";
        }
    }
</script>
</body>
</html>
