<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterLotto VIP - ระบบคำนวณอัจฉริยะ</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #05070e; 
            color: #f8fafc; 
            margin: 0; 
            padding: 15px; 
            overflow-x: hidden;
        }
        .vip-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background: #0f172a; 
            padding: 24px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        /* เอฟเฟกต์ดาวกระพริบวิบวับหัวข้อหลัก */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star-sparkle {
            display: inline-block;
            animation: twinkle 1.5s infinite ease-in-out;
        }

        .header-box { text-align: center; margin-bottom: 24px; }
        .header-box h2 { 
            color: #fbbf24; margin: 0 0 5px 0; font-size: 1.7rem; 
            text-shadow: 0 0 15px rgba(251,191,36,0.6), 0 0 30px rgba(251,191,36,0.3); 
            letter-spacing: 0.5px; 
        }
        .header-box p { color: #94a3b8; font-size: 0.85rem; margin: 0; }

        /* แพ็กเกจหน้าแรก 4 ช่อง พร้อมแสงวิ่งขอบ */
        .package-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
        
        @keyframes borderGlow1 {
            0% { border-color: rgba(232,121,249,0.3); box-shadow: 0 0 5px rgba(232,121,249,0.2); }
            50% { border-color: rgba(232,121,249,0.9); box-shadow: 0 0 20px rgba(232,121,249,0.6); }
            100% { border-color: rgba(232,121,249,0.3); box-shadow: 0 0 5px rgba(232,121,249,0.2); }
        }
        @keyframes borderGlow2 {
            0% { border-color: rgba(56,189,248,0.3); box-shadow: 0 0 5px rgba(56,189,248,0.2); }
            50% { border-color: rgba(56,189,248,0.9); box-shadow: 0 0 20px rgba(56,189,248,0.6); }
            100% { border-color: rgba(56,189,248,0.3); box-shadow: 0 0 5px rgba(56,189,248,0.2); }
        }
        @keyframes borderGlow3 {
            0% { border-color: rgba(251,191,36,0.3); box-shadow: 0 0 5px rgba(251,191,36,0.2); }
            50% { border-color: rgba(251,191,36,0.9); box-shadow: 0 0 25px rgba(251,191,36,0.7); }
            100% { border-color: rgba(251,191,36,0.3); box-shadow: 0 0 5px rgba(251,191,36,0.2); }
        }
        @keyframes borderGlow4 {
            0% { border-color: rgba(74,222,128,0.3); box-shadow: 0 0 5px rgba(74,222,128,0.2); }
            50% { border-color: rgba(74,222,128,0.9); box-shadow: 0 0 20px rgba(74,222,128,0.6); }
            100% { border-color: rgba(74,222,128,0.3); box-shadow: 0 0 5px rgba(74,222,128,0.2); }
        }

        .package-card { background: #131c2e; padding: 16px 12px; border-radius: 16px; text-align: center; border-width: 2px; border-style: solid; }
        .package-card-1 { animation: borderGlow1 3s infinite; color: #e879f9; }
        .package-card-2 { animation: borderGlow2 3s infinite; color: #38bdf8; }
        .package-card-3 { animation: borderGlow3 2.5s infinite; color: #fbbf24; }
        .package-card-4 { animation: borderGlow4 3s infinite; color: #4ade80; }
        
        .package-card h3 { margin: 0 0 6px 0; font-size: 0.95rem; }
        .price { font-size: 1.3rem; font-weight: bold; color: #f87171; text-shadow: 0 0 10px rgba(248,113,113,0.3); margin-bottom: 2px; }
        .desc { font-size: 0.75rem; color: #94a3b8; }

        /* ช่องชำระเงิน */
        .payment-box { background: #0b0f19; border: 1px solid rgba(51,65,85,0.8); padding: 16px; border-radius: 16px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
        .payment-box h4 { margin: 0 0 10px 0; color: #38bdf8; }
        .bank-num { color: #fbbf24; font-weight: bold; background: #1e293b; padding: 6px 12px; border-radius: 6px; display: inline-block; letter-spacing: 1.5px; box-shadow: 0 0 10px rgba(251,191,36,0.2); font-size: 1.1rem; margin: 4px 0; }

        /* ปุ่มแจ้งสลิป */
        @keyframes btnPulse {
            0% { box-shadow: 0 0 10px rgba(5,150,105,0.4); }
            50% { box-shadow: 0 0 25px rgba(5,150,105,0.8); }
            100% { box-shadow: 0 0 10px rgba(5,150,105,0.4); }
        }
        .btn-line { 
            display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #059669, #047857); color: white; 
            text-align: center; text-decoration: none; border-radius: 14px; font-weight: bold; margin-bottom: 20px; 
            animation: btnPulse 2s infinite; font-size: 0.95rem;
        }

        /* ส่วนเข้าสู่ระบบ */
        .login-section { background: #0b0f19; padding: 18px; border-radius: 16px; border: 1px solid rgba(51,65,85,0.8); text-align: center; }
        .login-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
        .input-group { margin-bottom: 12px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155; background: #131c2e; color: white; font-size: 1rem; text-align: center; letter-spacing: 1px; outline: none; transition: 0.3s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.4); }
        input::placeholder { color: #64748b; }
        
        button.action-btn { 
            width: 100%; padding: 14px; background: #1e293b; border: 1px solid #475569; border-radius: 12px; 
            color: #f8fafc; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        button.action-btn:active { transform: scale(0.97); }

        .error-msg { color: #f87171; font-size: 0.8rem; margin-top: 6px; display: none; text-align: center; }

        /* หน้าคำนวณสูตร (ซ่อนไว้ก่อน) */
        #calculatorView { display: none; }
        
        .calc-box { margin-bottom: 15px; text-align: left; }
        .calc-box label { display: block; font-size: 0.9rem; color: #cbd5e1; margin-bottom: 6px; }
        
        .btn-calculate {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #059669, #047857); color: white;
            border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer;
            box-shadow: 0 0 15px rgba(5,150,105,0.5); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* การ์ดผลลัพธ์สูตรสไตล์เรียบหรู ไม่รกตา */
        .formula-card { 
            background: #0b0f19; padding: 14px 16px; margin-bottom: 16px; border-radius: 16px; 
            border: 1px solid rgba(56,189,248,0.25);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            animation: borderGlow2 4s infinite;
            text-align: left;
        }
        .formula-title { color: #38bdf8; font-weight: bold; margin-bottom: 2px; font-size: 1.05rem; }
        .formula-sub { color: #fbbf24; font-size: 0.85rem; margin-bottom: 10px; }

        /* แถวชุดเจาะแบบมีปุ่มคัดลอกวิบวับ */
        @keyframes iconBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.15); filter: drop-shadow(0 0 6px rgba(251,191,36,0.8)); }
        }
        .copy-row {
            background: #131c2e; 
            border: 1px solid rgba(51,65,85,0.8); 
            padding: 10px 14px; 
            border-radius: 12px; 
            margin-bottom: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }
        .copy-row:hover {
            border-color: #38bdf8;
            background: #17223b;
        }
        .copy-row:active {
            transform: scale(0.98);
        }
        .copy-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .copy-content-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .copy-numbers {
            font-family: monospace;
            font-size: 0.95rem;
            color: #4ade80;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .sparkle-clipboard {
            display: inline-block;
            font-size: 1.1rem;
            animation: iconBounce 1.5s infinite ease-in-out;
        }
        
        .highlight { color: #f87171; font-weight: bold; }

        /* Toast แจ้งเตือนคัดลอก */
        #toast {
            visibility: hidden; min-width: 200px; background: linear-gradient(135deg, #059669, #047857); color: #fff;
            text-align: center; border-radius: 12px; padding: 12px 20px; position: fixed;
            z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-size: 0.9rem; font-weight: bold; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
        }
        #toast.show { visibility: visible; animation: fadeInOut 1.5s ease-in-out; }
        @keyframes fadeInOut {
            0% { bottom: 0px; opacity: 0; }
            20% { bottom: 30px; opacity: 1; }
            80% { bottom: 30px; opacity: 1; }
            100% { bottom: 10px; opacity: 0; }
        }

        .back-btn { background: #334155 !important; border: none !important; margin-top: 10px; }
    </style>
</head>
<body>

<div class="vip-container">
    
    <!-- หน้าแรก: แพ็กเกจ & เข้าสู่ระบบ -->
    <div id="loginView">
        <div class="header-box">
            <h2><span class="star-sparkle">✨</span> MasterLotto VIP <span class="star-sparkle">✨</span></h2>
            <p>ระบบวิเคราะห์สูตรคำนวณแม่นยำพิเศษ สำหรับสมาชิก VIP</p>
        </div>

        <div class="package-grid">
