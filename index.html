<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterLotto VIP - กำลังปรับปรุงระบบ</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #05070e; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .maintenance-container { 
            max-width: 480px; 
            width: 100%;
            background: #0f172a; 
            padding: 30px 24px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        /* เอฟเฟกต์ดาวกระพริบวิบวับ */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star-sparkle {
            display: inline-block;
            animation: twinkle 1.5s infinite ease-in-out;
        }

        /* ไอคอนเกียร์หมุนแจ้งซ่อม */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .maintenance-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: spin 4s linear infinite;
        }

        h2 { 
            color: #fbbf24; 
            margin: 0 0 10px 0; 
            font-size: 1.6rem; 
            text-shadow: 0 0 15px rgba(251,191,36,0.5); 
        }

        .desc { 
            color: #94a3b8; 
            font-size: 0.95rem; 
            line-height: 1.6;
            margin-bottom: 25px; 
        }

        /* กล่องแจ้งเตือนสถานะ */
        .status-box {
            background: #131c2e;
            border: 1px solid rgba(56,189,248,0.3);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 25px;
            color: #38bdf8;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(56,189,248,0.1);
        }

        /* ปุ่มติดต่อสอบถาม */
        @keyframes btnPulse {
            0% { box-shadow: 0 0 10px rgba(5,150,105,0.4); }
            50% { box-shadow: 0 0 25px rgba(5,150,105,0.8); }
            100% { box-shadow: 0 0 10px rgba(5,150,105,0.4); }
        }
        .btn-line { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #059669, #047857); 
            color: white; 
            text-align: center; 
            text-decoration: none; 
            border-radius: 14px; 
            font-weight: bold; 
            animation: btnPulse 2s infinite; 
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="maintenance-container">
    <div class="maintenance-icon">🛠️</div>
    <h2><span class="star-sparkle">✨</span> ระบบกำลังปรับปรุง <span class="star-sparkle">✨</span></h2>
    
    <p class="desc">
        ขออภัยในความไม่สะดวกครับ ขณะนี้ระบบ MasterLotto VIP กำลังอยู่ในระหว่างอัปเดตพัฒนาระบบคำนวณและฐานข้อมูลให้มีความแม่นยำสูงยิ่งขึ้น
    </p>

    <div class="status-box">
        ⏳ กรุณารอสักครู่ ระบบจะเปิดให้บริการตามปกติเร็วๆ นี้
    </div>

    <a href="https://line.me" target="_blank" class="btn-line">💬 ติดต่อสอบถาม / แจ้งปัญหาทาง LINE</a>
</div>

</body>
</html>
